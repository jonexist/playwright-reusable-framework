name: Setup E2E Node
description: Install Node dependencies (npm ci), restore the Playwright browser cache and install Chromium

inputs:
  install-playwright:
    description: Whether to install Playwright browsers
    required: false
    default: "true"
  node-version:
    description: Node.js version
    required: false
    default: "20"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Restore Playwright browsers cache
      if: inputs.install-playwright == 'true'
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      shell: bash
      run: npm ci

    # System deps are only needed on a cold cache; the browser binaries are cached.
    - name: Install Playwright Chromium
      if: inputs.install-playwright == 'true'
      shell: bash
      run: |
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install chromium
        else
          npx playwright install chromium --with-deps
        fi
