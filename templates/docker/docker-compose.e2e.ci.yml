# TEMPLATE — ephemeral backend stack for E2E (database + cache + API).
#
# Copy to docker/docker-compose.e2e.ci.yml and replace every <PLACEHOLDER>.
# Derived from ProactiveMD's qa-automation/docker-compose.e2e.ci.yml.
#
# Run:  docker compose -f docker/docker-compose.e2e.ci.yml up -d --no-build --wait
#
# Guidelines (see docs/04-ci-setup.md):
#   - Include only what the API needs to boot and serve requests.
#   - Omit workers/queues when the app can run tasks inline (e.g. a
#     RUN_TASKS_SYNC-style flag), SMTP (use a console mail backend) and object
#     storage unless a test uploads files.
#   - Give the API a real health endpoint and wait on it (`--wait`), so seeding
#     and tests never race a half-started server.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: <DB_PASSWORD>      # throwaway: the DB only lives for the run
      POSTGRES_DB: postgres
    # volumes:
    #   - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro  # extra databases
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: e2e-api:ci                  # built earlier in the workflow, never pulled
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: ci-e2e-only
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: <DB_PASSWORD>
      REDIS_URL: redis://redis:6379/0
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend   # adjust per stack
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Vendor "always passes" test keys, e.g. Cloudflare Turnstile:
      # TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/<HEALTH_PATH>'')" || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 120s
